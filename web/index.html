<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QKD Sampler</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="h-12 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 shrink-0">
    <h1 class="text-sm font-semibold tracking-wide uppercase">QKD Sampler</h1>
    <div class="flex items-center gap-4">
      <button id="download-btn" class="text-xs border border-slate-300 dark:border-slate-600 px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800" title="Download CSV">↓ CSV</button>
      <button id="theme-toggle" class="text-xs border border-slate-300 dark:border-slate-600 px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">◐ Theme</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside id="params-form" class="w-72 border-r border-slate-200 dark:border-slate-700 flex flex-col overflow-y-auto shrink-0 p-4 gap-5 text-sm">
      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Protocols</label>
        <div id="protocols" class="space-y-1"></div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Sifted Key Size (N)</label>
        <div id="sizes-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="sizes-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Interception Rate (ε)</label>
        <div id="interception_rates-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="interception_rates-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Noise Probability</label>
        <div id="noise_probabilities-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="noise_probabilities-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Confidence Level</label>
        <div id="confidences-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="confidences-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Repetitions</label>
        <input id="repetitions-input" type="number" value="1" min="1" class="w-full border border-slate-300 dark:border-slate-600 rounded px-2 py-1 text-xs font-mono bg-transparent" />
      </div>

      <div id="form-error" class="text-xs text-red-600 dark:text-red-400 min-h-[1rem]"></div>

      <div class="mt-auto flex flex-col gap-2">
        <button id="run-btn" class="w-full bg-blue-600 text-white py-2 rounded text-xs font-semibold uppercase tracking-wider hover:bg-blue-700 transition-colors">Run Simulation</button>
        <button id="abort-btn" class="hidden w-full bg-red-600 text-white py-2 rounded text-xs font-semibold uppercase tracking-wider hover:bg-red-700 transition-colors">Abort</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6 space-y-4">
      <!-- Progress -->
      <div class="flex items-center gap-3">
        <div class="flex-1 h-2 bg-slate-200 dark:bg-slate-700 rounded overflow-hidden">
          <div id="progress-bar" class="h-full bg-blue-600 transition-all" style="width: 0%"></div>
        </div>
        <span id="progress-text" class="text-xs font-mono text-slate-500 dark:text-slate-400 w-20 text-right">0 / 0</span>
      </div>

      <!-- Metrics -->
      <div class="grid grid-cols-4 gap-3">
        <div class="border border-slate-200 dark:border-slate-700 rounded p-3">
          <div class="text-[10px] uppercase text-slate-500 dark:text-slate-400 font-medium">Avg QBER</div>
          <div id="metric-qber" class="text-lg font-mono font-semibold">—</div>
        </div>
        <div class="border border-slate-200 dark:border-slate-700 rounded p-3">
          <div class="text-[10px] uppercase text-slate-500 dark:text-slate-400 font-medium">Avg Key Length</div>
          <div id="metric-keylen" class="text-lg font-mono font-semibold">—</div>
        </div>
        <div class="border border-slate-200 dark:border-slate-700 rounded p-3">
          <div class="text-[10px] uppercase text-slate-500 dark:text-slate-400 font-medium">Secure / Total</div>
          <div id="metric-secure" class="text-lg font-mono font-semibold">—</div>
        </div>
        <div class="border border-slate-200 dark:border-slate-700 rounded p-3">
          <div class="text-[10px] uppercase text-slate-500 dark:text-slate-400 font-medium">Key Efficiency</div>
          <div id="metric-efficiency" class="text-lg font-mono font-semibold">—</div>
        </div>
      </div>

      <!-- Charts -->
      <div id="charts-section" class="hidden space-y-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div id="chart-scatter" class="lg:col-span-2 h-80 border border-slate-200 dark:border-slate-700 rounded"></div>
          <div id="chart-bar" class="h-80 border border-slate-200 dark:border-slate-700 rounded"></div>
        </div>
        <div id="chart-hist" class="h-64 border border-slate-200 dark:border-slate-700 rounded"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
