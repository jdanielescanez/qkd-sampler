<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QKD Sampler</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside id="params-form" class="fixed inset-0 z-40 bg-white dark:bg-slate-900 flex flex-col overflow-y-auto text-sm translate-x-[-100%] transition-transform duration-200 lg:static lg:translate-x-0 lg:w-72 lg:shrink-0 lg:border-r lg:border-slate-200 dark:lg:border-slate-700">
      <div class="h-[45px] flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-700 shrink-0">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Simulation Parameters</h2>
        <button id="sidebar-close" class="lg:hidden text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 text-lg leading-none">&times;</button>
      </div>
      <div class="flex flex-col gap-5 p-4 overflow-y-auto">
      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Protocols</label>
        <div id="protocols" class="space-y-1"></div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Sifted Key Size (N)</label>
        <div id="sizes-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="sizes-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Interception Rate (ε)</label>
        <div id="interception_rates-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="interception_rates-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Noise Probability</label>
        <div id="noise_probabilities-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="noise_probabilities-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Confidence Level</label>
        <div id="confidences-tags" class="flex flex-wrap gap-1 items-center border border-slate-300 dark:border-slate-600 rounded p-1.5 min-h-[36px]">
          <input id="confidences-input" type="text" placeholder="Add..." class="flex-1 min-w-[60px] bg-transparent border-none outline-none text-xs font-mono p-0" />
        </div>
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Repetitions</label>
        <input id="repetitions-input" type="number" value="1" min="1" class="w-full border border-slate-300 dark:border-slate-600 rounded px-2 py-1 text-xs font-mono bg-transparent" />
      </div>

      <div>
        <label class="block font-medium mb-1 uppercase text-xs text-slate-500 dark:text-slate-400">Seed</label>
        <input id="seed-input" type="number" value="42" min="0" class="w-full border border-slate-300 dark:border-slate-600 rounded px-2 py-1 text-xs font-mono bg-transparent" />
      </div>

      <div id="form-error" class="text-xs text-red-600 dark:text-red-400 min-h-[1rem]"></div>

      <div class="mt-auto flex flex-col gap-2">
        <button id="run-btn" class="w-full bg-blue-600 text-white py-2 rounded text-xs font-semibold uppercase tracking-wider hover:bg-blue-700 transition-colors">Run Simulation</button>
        <button id="abort-btn" class="hidden w-full bg-red-600 text-white py-2 rounded text-xs font-semibold uppercase tracking-wider hover:bg-red-700 transition-colors">Abort</button>
      </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header class="h-[45px] border-b border-slate-200 dark:border-slate-700 flex items-center justify-between pl-4 pr-6 shrink-0">
        <div class="flex items-center gap-3">
          <button id="sidebar-open" class="lg:hidden text-slate-600 dark:text-slate-300 text-lg leading-none">☰</button>
          <h1 class="text-xs font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-300">Results</h1>
        </div>
        <div class="flex items-center gap-4">
          <button id="download-btn" class="hidden text-xs border border-slate-300 dark:border-slate-600 px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800" title="Download CSV">↓ CSV</button>
          <button id="theme-toggle" class="text-xs border border-slate-300 dark:border-slate-600 px-3 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">◐ Theme</button>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-6 space-y-4 relative">
      <!-- Idle Banner (shown when no simulation has run) -->
      <div id="idle-banner" class="flex items-center justify-center h-full">
        <div class="border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 shadow-sm p-10 text-center max-w-md">
          <div class="mx-auto mb-4 flex justify-center">
            <img src="/qkd-crate-light.png" alt="QKD Sampler" class="h-28 dark:hidden" /><img src="/qkd-crate-dark.png" alt="QKD Sampler" class="h-28 hidden dark:block" />
          </div>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-blue-600 mb-2">No Simulation Data</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-5">Configure your protocol parameters in the sidebar and click "Run Simulation" to begin the quantum key distribution analysis.</p>
          <div class="flex justify-center gap-3">
            <span class="inline-flex items-center gap-1.5 text-[11px] font-mono border border-slate-200 dark:border-slate-600 rounded px-3 py-1.5"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>ENGINE IDLE</span>
          </div>
        </div>
      </div>

      <!-- Circular Loader (shown during simulation) -->
      <div id="sim-loader" class="hidden absolute inset-0 flex items-center justify-center">
        <div class="relative">
          <svg width="200" height="200" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="8" class="text-slate-200 dark:text-slate-700" />
            <circle cx="100" cy="100" r="90" fill="none" stroke-width="8"
              class="loader-green"
              stroke="#22c55e"
              stroke-dasharray="565.49"
              stroke-dashoffset="565.49"
              stroke-linecap="round"
              transform="rotate(-90 100 100)"
              style="transition: stroke-dashoffset 0.3s ease;" />
            <circle cx="100" cy="100" r="90" fill="none" stroke-width="8"
              class="loader-red"
              stroke="#ef4444"
              stroke-dasharray="565.49"
              stroke-dashoffset="565.49"
              stroke-linecap="round"
              transform="rotate(-90 100 100)"
              style="transition: stroke-dashoffset 0.3s ease, transform 0.3s ease;" />
          </svg>
          <div class="loader-text absolute inset-0 flex items-center justify-center text-3xl font-mono font-semibold">0 / 0</div>
        </div>
      </div>

      <!-- Filters -->
      <div id="filters-section" class="hidden flex flex-wrap justify-center lg:justify-start gap-4 lg:gap-6 items-end pb-4 mb-4 border-b border-slate-200 dark:border-slate-700"></div>

      <!-- Metrics (hidden until simulation completes, rendered dynamically per protocol) -->
      <div id="metrics-section" class="hidden space-y-3"></div>

      <!-- Charts -->
      <div id="charts-section" class="hidden space-y-4">
        <div class="border border-slate-200 dark:border-slate-700 rounded overflow-hidden">
          <div id="zero-bar-measured" class="px-4 pt-3"></div>
          <div id="chart-measured-qber" class="h-60 lg:h-80" style="width:100%"></div>
        </div>
        <div class="border border-slate-200 dark:border-slate-700 rounded overflow-hidden">
          <div id="zero-bar-final" class="px-4 pt-3"></div>
          <div id="chart-final-qber" class="h-60 lg:h-80" style="width:100%"></div>
        </div>
      </div>
      </div>
    </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
