name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "feature/web-ui"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Check out latest qkd source
        uses: actions/checkout@v4
        with:
          repository: jdanielescanez/qkd
          path: qkd-lib

      - name: Place qkd where Cargo expects it
        run: ln -s "$GITHUB_WORKSPACE/qkd-lib" "$GITHUB_WORKSPACE/../qkd"

      - name: Build WASM
        working-directory: web/crate
        run: wasm-pack build --target web --out-dir ../wasm --release

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
